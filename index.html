<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudioZIO Tempo Delay — Native AU, VST3 & Standalone Stereo Delay Plugin</title>
  <meta name="description" content="High-precision stereo tempo-synced delay plugin for modern music producers. Features independent L/R note divisions, ping-pong routing, analog soft drive, and feedback tone filters.">
  <meta name="keywords" content="StudioZIO, ZIO, Tempo Delay, Audio Plugin, AU, VST3, Standalone, Stereo Delay, Ping-Pong Delay, JUCE, Music Production, Audio Engineering">
  <meta name="theme-color" content="#14161A">

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="StudioZIO Tempo Delay — Native AU, VST3 & Standalone Stereo Delay Plugin">
  <meta property="og:description" content="High-precision stereo tempo-synced delay plugin for modern music producers. Founded by producer and recording artist ZIO.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://studiozio.audio/tempo-delay">
  <meta property="og:image" content="https://studiozio.audio/assets/tempo-delay-og.png">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="StudioZIO Tempo Delay">
  <meta name="twitter:description" content="Native stereo delay plugin engineered by producer and recording artist ZIO for StudioZIO.">
  <meta name="twitter:image" content="https://studiozio.audio/assets/tempo-delay-og.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#14161A',
            brandPanel: '#1D2026',
            brandCyan: '#22D3EE',
            brandAmber: '#F5A524',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'liberation mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Custom Scrollbars, Focus Rings & Pure GPU Keyframe Animations -->
  <style>
    body {
      background-color: #14161A;
      color: #E2E8F0;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #14161A;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2026;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #22D3EE;
    }
    :focus-visible {
      outline: 2px solid #22D3EE;
      outline-offset: 2px;
    }

    /* PURE CSS GPU KEYFRAME ANIMATIONS FOR IMPULSE PING */
    @keyframes pulseMoveL {
      0% {
        left: -15%;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        left: 105%;
        opacity: 0;
      }
    }

    @keyframes pulseMoveR {
      0% {
        left: -15%;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        left: 105%;
        opacity: 0;
      }
    }

    .impulse-ping-active-l {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      width: 100px !important;
      background: linear-gradient(90deg, transparent, #22D3EE, #ffffff, #22D3EE, transparent) !important;
      border-radius: 9999px !important;
      box-shadow: 0 0 15px #22D3EE, 0 0 25px #22D3EE !important;
      animation: pulseMoveL 1.5s linear infinite !important;
    }

    .impulse-ping-active-r {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      width: 100px !important;
      background: linear-gradient(90deg, transparent, #F5A524, #ffffff, #F5A524, transparent) !important;
      border-radius: 9999px !important;
      box-shadow: 0 0 15px #F5A524, 0 0 25px #F5A524 !important;
      animation: pulseMoveR 1.5s linear infinite 0.75s !important;
    }

    .impulse-ping-idle {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 40px !important;
      background: #334155 !important;
      opacity: 0.3 !important;
      border-radius: 9999px !important;
    }
  </style>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for runtime JSX/TSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#14161A] text-[#E2E8F0] antialiased selection:bg-[#22D3EE] selection:text-[#14161A]">

  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-[#22D3EE] focus:text-[#14161A] focus:font-bold focus:rounded-md">
    Skip to main content
  </a>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Standalone App Script -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
