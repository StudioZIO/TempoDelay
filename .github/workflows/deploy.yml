name: StudioZIO Tempo Delay Manual Preview Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempo-delay-preview-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source for the committed lockfile
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install the locked tool capsule without lifecycle scripts
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const blocked=['preinstall','install','postinstall','prepare','prepublish','prepublishOnly']; for (const name of blocked) if (p.scripts?.[name]) throw new Error('Root lifecycle script is prohibited in tooling job: '+name)"
          npm ci --ignore-scripts
          test "$(node -p "require('./node_modules/vercel/package.json').version")" = "59.10.0"
          ./node_modules/.bin/vercel --version

      - name: Create deterministic Vercel CLI capsule and digest
        run: |
          set -euo pipefail
          node --check scripts/verify_tar_archive.mjs
          mkdir -p .workflow-artifacts
          tar --format=posix --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime -czf .workflow-artifacts/vercel-cli-node-modules.tgz node_modules
          cp scripts/verify_tar_archive.mjs .workflow-artifacts/verify_tar_archive.mjs
          (cd .workflow-artifacts && sha256sum vercel-cli-node-modules.tgz > vercel-cli-node-modules.tgz.sha256)
          (cd .workflow-artifacts && sha256sum verify_tar_archive.mjs > verify_tar_archive.mjs.sha256)

      - name: Upload immutable Vercel CLI capsule
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tempo-delay-vercel-cli-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workflow-artifacts/vercel-cli-node-modules.tgz
            .workflow-artifacts/vercel-cli-node-modules.tgz.sha256
            .workflow-artifacts/verify_tar_archive.mjs
            .workflow-artifacts/verify_tar_archive.mjs.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  preview-project-settings:
    needs: tooling
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js 22
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Download immutable Vercel CLI capsule
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tempo-delay-vercel-cli-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tooling-capsule

      - name: Verify and restore the locked official Vercel CLI
        run: |
          set -euo pipefail
          (cd .tooling-capsule && sha256sum --check vercel-cli-node-modules.tgz.sha256)
          (cd .tooling-capsule && sha256sum --check verify_tar_archive.mjs.sha256)
          node .tooling-capsule/verify_tar_archive.mjs .tooling-capsule/vercel-cli-node-modules.tgz node_modules
          mkdir -p .preview-tooling
          tar -xzf .tooling-capsule/vercel-cli-node-modules.tgz -C .preview-tooling
          test "$(node -p "require('./.preview-tooling/node_modules/vercel/package.json').version")" = "59.10.0"
          ./.preview-tooling/node_modules/.bin/vercel --version
          mkdir -p "$RUNNER_TEMP/tempo-delay-preview-link"

      - name: Pull exact preview project settings
        working-directory: ${{ runner.temp }}/tempo-delay-preview-link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: '"$GITHUB_WORKSPACE/.preview-tooling/node_modules/.bin/vercel" pull --yes --environment=preview --token="$VERCEL_TOKEN"'

      - name: Verify pulled preview project identity
        working-directory: ${{ runner.temp }}/tempo-delay-preview-link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('.vercel/project.json','utf8')); if (p.orgId!==process.env.VERCEL_ORG_ID || p.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Pulled preview project identity does not match the configured project')"

  build-preview-artifact:
    needs: [tooling, preview-project-settings]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked application dependencies without deployment credentials
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm ci

      - name: Verify the preview-only workflow contract
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm run verify:preview-workflow
          npm run verify:tar-archive:test

      - name: Typecheck without deployment credentials
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm run typecheck

      - name: Build the single authoritative application output
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm run build

      - name: Verify static output and adversarial rejection contracts
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm run verify:dist
          npm run verify:dist:test

      - name: Construct and verify the deterministic Build Output API artifact
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          npm run assemble:vercel
          npm run verify:vercel-config
          npm run verify:vercel-config:test
          npm run verify:dist -- .vercel/output/static
          diff --recursive --brief --no-dereference dist .vercel/output/static

      - name: Create deterministic prebuilt archive and digest
        run: |
          set -euo pipefail
          test -z "${VERCEL_TOKEN:-}"
          mkdir -p .workflow-artifacts
          tar --format=posix --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime -czf .workflow-artifacts/vercel-prebuilt-output.tgz .vercel/output
          (cd .workflow-artifacts && sha256sum vercel-prebuilt-output.tgz > vercel-prebuilt-output.tgz.sha256)

      - name: Upload immutable verified preview artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tempo-delay-vercel-prebuilt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workflow-artifacts/vercel-prebuilt-output.tgz
            .workflow-artifacts/vercel-prebuilt-output.tgz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy-preview:
    needs: [tooling, preview-project-settings, build-preview-artifact]
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Set up Node.js 22
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Download immutable Vercel CLI capsule
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tempo-delay-vercel-cli-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cli-artifact

      - name: Download immutable prebuilt preview artifact
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tempo-delay-vercel-prebuilt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .prebuilt-artifact

      - name: Verify both transferred artifacts before use
        run: |
          set -euo pipefail
          (cd .cli-artifact && sha256sum --check vercel-cli-node-modules.tgz.sha256)
          (cd .cli-artifact && sha256sum --check verify_tar_archive.mjs.sha256)
          (cd .prebuilt-artifact && sha256sum --check vercel-prebuilt-output.tgz.sha256)
          node .cli-artifact/verify_tar_archive.mjs .cli-artifact/vercel-cli-node-modules.tgz node_modules
          node .cli-artifact/verify_tar_archive.mjs .prebuilt-artifact/vercel-prebuilt-output.tgz .vercel/output
          mkdir -p .deployment-tools
          tar -xzf .cli-artifact/vercel-cli-node-modules.tgz -C .deployment-tools
          tar -xzf .prebuilt-artifact/vercel-prebuilt-output.tgz -C .
          test "$(node -p "require('./.deployment-tools/node_modules/vercel/package.json').version")" = "59.10.0"
          ./.deployment-tools/node_modules/.bin/vercel --version

      - name: Verify extracted deployment boundary without application source
        run: |
          set -euo pipefail
          test -z "$(find .vercel/output -type l -print -quit)"
          # This job deliberately has no application source, so it cannot call
          # scripts/verify_vercel_config.mjs -- which already deep-equals the
          # routes against the contract, in the job that built this artifact.
          # Restating that literal here bought nothing but drift: it sat pinned
          # to the retired two-route SPA shape and would have thrown on every
          # dispatch. What this step can usefully assert is the deployment
          # boundary itself, which is what its name promises.
          node -e "const fs=require('node:fs'); const root='.vercel/output'; const entries=fs.readdirSync(root).sort(); if (JSON.stringify(entries)!==JSON.stringify(['config.json','static'])) throw new Error('Unexpected Build Output API entries: '+entries.join(', ')); const c=JSON.parse(fs.readFileSync(root+'/config.json','utf8')); if (JSON.stringify(Object.keys(c).sort())!==JSON.stringify(['routes','version'])) throw new Error('Build Output API config carries unexpected top-level keys: '+Object.keys(c).join(', ')); if (c.version!==3) throw new Error('Build Output API version must be 3'); if (!Array.isArray(c.routes)||c.routes.length===0) throw new Error('Build Output API config declares no routes'); const sec=c.routes[0]; if (!sec||sec.src!=='/(.*)'||sec.continue!==true||!sec.headers||!sec.headers['content-security-policy']) throw new Error('The first route must be the security-header route'); for (const h of ['content-security-policy','x-frame-options','x-content-type-options','referrer-policy','permissions-policy','strict-transport-security']) if (!sec.headers[h]) throw new Error('Security header missing from the deployment artifact: '+h); if (!fs.lstatSync(root+'/static').isDirectory()) throw new Error('Static payload is missing')"

      - name: Deploy the verified prebuilt output to preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          preview_output="$("$GITHUB_WORKSPACE/.deployment-tools/node_modules/.bin/vercel" deploy --prebuilt --target=preview --yes --token="$VERCEL_TOKEN" --no-color)"
          preview_url="$(printf '%s\n' "$preview_output" | tail -n 1)"
          case "$preview_url" in https://*) ;; *) echo "Vercel did not return a preview URL" >&2; exit 1 ;; esac
          printf '%s\n' "$preview_output"
          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
          printf '### Verified preview deployment\n\n[%s](%s)\n' "$preview_url" "$preview_url" >> "$GITHUB_STEP_SUMMARY"
